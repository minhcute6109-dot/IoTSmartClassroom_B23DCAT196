; PlatformIO Project Configuration File for ESP32-C3 / LOLIN C3 Mini
; Bài 2.2: IoT Smart Classroom - Firmware ESP32-C3 giao tiếp MQTT

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Thư viện sử dụng
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0

; Cờ biên dịch cho ESP32-C3 USB CDC Serial
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
